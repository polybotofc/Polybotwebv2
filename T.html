<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="5;url=index.html">
<title>404 | Polybot</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: #000;
    overflow: hidden;
    font-family: -apple-system, 'Inter', Arial, sans-serif;
  }

  .pill {
    position: fixed;
    top: 24px;
    left: 50%;
    display: flex;
    align-items: center;
    height: 44px;
    width: 56px;
    background: #17181c;
    border: 1px solid #2a2c33;
    border-radius: 50%;
    overflow: hidden;
    transform: translate(-50%, -160%);
    animation: drop-hold-retract 5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .pill .icon {
    flex: 0 0 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #ff453a;
  }

  .pill .icon::before {
    content: "!";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255, 69, 58, 0.15);
  }

  .pill .msg {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #f2f2f7;
    font-size: 13px;
    padding-right: 18px;
    opacity: 0;
    animation: fade-text 5s ease forwards;
  }

  @keyframes drop-hold-retract {
    0%   { width: 56px;  border-radius: 50%; transform: translate(-50%, -160%); }
    12%  { width: 340px; border-radius: 22px; transform: translate(-50%, 0%); }
    72%  { width: 340px; border-radius: 22px; transform: translate(-50%, 0%); }
    88%  { width: 56px;  border-radius: 50%; transform: translate(-50%, -160%); }
    100% { width: 56px;  border-radius: 50%; transform: translate(-50%, -160%); }
  }

  @keyframes fade-text {
    0%   { opacity: 0; }
    16%  { opacity: 1; }
    70%  { opacity: 1; }
    80%  { opacity: 0; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="pill">
    <span class="icon"></span>
    <span class="msg" id="msg"></span>
  </div>

  <script>
    document.getElementById('msg').textContent = window.location.href + ' not found';

    setTimeout(function () {
      window.location.replace('index.html');
    }, 5000);
  </script>

</body>
</html>
