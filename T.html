<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="5;url=index.html">
<title>404 | Polybot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --bg: #10141c;
    --surface: #161c26;
    --border: #262f3d;
    --text: #e8edf5;
    --text-muted: #8b97ab;
    --accent: #8aa3ff;
    --warn: #ff8a8a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; width: 100%; }

  .site-header { border-bottom: 1px solid var(--border); }
  .site-header .wrap {
    display: flex; align-items: center; justify-content: center;
    padding: 20px 24px;
  }

  .logo {
    display: flex; align-items: baseline; gap: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 20px; color: var(--text);
  }
  .logo .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warn); display: inline-block;
  }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 48px 0;
  }

  .card { max-width: 560px; width: 100%; text-align: center; padding: 0 24px; }

  .code {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 88px; line-height: 1;
    margin: 0 0 8px; color: var(--warn); letter-spacing: -2px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 22px; margin: 0 0 14px;
  }

  .url-box {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    word-break: break-all;
    margin: 0 0 8px;
  }

  .not-found-label {
    color: var(--warn);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    margin: 0 0 28px;
  }

  .redirect-box {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }

  .redirect-box .n {
    color: var(--accent);
    font-weight: 500;
    min-width: 1ch;
    display: inline-block;
    text-align: center;
  }

  .manual-link { display: block; margin-top: 20px; font-size: 13px; }

  .site-footer { border-top: 1px solid var(--border); }
  .site-footer .wrap {
    padding: 18px 24px; text-align: center;
    font-size: 13px; color: var(--text-muted);
  }

  @media (max-width: 480px) {
    .code { font-size: 64px; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <span class="logo"><span class="dot"></span>Polybot</span>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="code">404</div>
      <h1>Halaman ini sudah nggak ada.</h1>
      <span class="url-box" id="url-target">memuat url...</span>
      <p class="not-found-label">not found</p>

      <div class="redirect-box">
        Dialihkan ke beranda dalam <span class="n" id="count">5</span> detik
      </div>

      <a href="index.html" class="manual-link">Atau klik di sini kalau nggak mau nunggu</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">© 2024–2026 Polybot. Layanan tidak lagi berjalan.</div>
  </footer>

  <script>
    document.getElementById('url-target').textContent = window.location.href;

    var sisa = 5;
    var el = document.getElementById('count');
    var timer = setInterval(function () {
      sisa -= 1;
      if (sisa <= 0) {
        clearInterval(timer);
        window.location.replace('index.html');
      } else {
        el.textContent = sisa;
      }
    }, 1000);
  </script>

</body>
</html>
